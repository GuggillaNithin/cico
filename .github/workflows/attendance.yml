name: Automated Attendance

on:
  schedule:
    # 04:00 UTC = 09:30 IST (Clock In)
    - cron: '0 4 * * 1-5'
    # 13:00 UTC = 18:30 IST (Clock Out)
    - cron: '0 13 * * 1-5'
  
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'clockin'
        type: choice
        options:
          - clockin
          - clockout

jobs:
  attendance:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # caching pip dependencies

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Ensure Playwright browsers are installed
        run: playwright install chromium

      - name: Determine Action (Cron)
        id: determine_action
        run: |
          # If triggered by workflow_dispatch, use the input. Otherwise, infer from cron.
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "action=${{ github.event.inputs.action }}" >> $GITHUB_OUTPUT
          else
            # Cron trigger
            HOUR=$(date -u +%H)
            if [ "$HOUR" == "04" ]; then
              echo "action=clockin" >> $GITHUB_OUTPUT
            elif [ "$HOUR" == "13" ]; then
              echo "action=clockout" >> $GITHUB_OUTPUT
            else
              # Fallback just in case
              echo "action=clockin" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Reconstruct Storage State
        run: |
          echo "${{ secrets.PLAYWRIGHT_STORAGE_STATE }}" > storage_state.json
          
      - name: Run Attendance Bot
        env:
          ATTENDANCE_URL: ${{ secrets.ATTENDANCE_URL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_RECIPIENT: ${{ secrets.ALERT_EMAIL_RECIPIENT }}
        run: |
          python main.py --action ${{ steps.determine_action.outputs.action }}

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs/
          retention-days: 7

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 7
